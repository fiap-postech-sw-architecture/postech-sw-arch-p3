<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Logo do PytStop: engrenagem (oficina) com as duas serpentes do Python
    entrelacadas e a marca "PytStop" (Pyt azul, Stop amarelo).
    O wordmark usa dois <text> ancorados (end/start) em vez de tspans com
    letter-spacing: renderizadores como o librsvg sobrepunham o "t" ao "S".
    PNG gerado com: rsvg-convert -w 1024 -h 1024 logo-pytstop.svg -o logo-pytstop.png
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="pyblue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6DB3EA"/>
      <stop offset="1" stop-color="#3776AB"/>
    </linearGradient>
    <linearGradient id="pyyellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE873"/>
      <stop offset="1" stop-color="#FFC107"/>
    </linearGradient>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#64748b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- Engrenagem: anel com oito dentes arredondados -->
  <g transform="translate(256,206)">
    <circle r="132" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="2"/>
    <g fill="url(#gear)">
      <rect x="-17" y="-134" width="34" height="30" rx="8"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(45)"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(90)"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(135)"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(180)"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(225)"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(270)"/>
      <rect x="-17" y="-134" width="34" height="30" rx="8" transform="rotate(315)"/>
    </g>
    <circle r="106" fill="none" stroke="url(#gear)" stroke-width="18"/>
    <circle r="90" fill="#111c30"/>
    <circle r="90" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

    <!-- Serpentes do Python: mesma forma, a amarela girada 180 graus -->
    <g fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -8,-64 H 26 A 18,18 0 0 1 44,-46 V -28 A 18,18 0 0 1 26,-10 H -26 A 18,18 0 0 0 -44,8 V 14" stroke="url(#pyblue)"/>
      <path d="M -8,-64 H 26 A 18,18 0 0 1 44,-46 V -28 A 18,18 0 0 1 26,-10 H -26 A 18,18 0 0 0 -44,8 V 14" stroke="url(#pyyellow)" transform="rotate(180)"/>
    </g>
    <circle cx="0" cy="-64" r="3.2" fill="#0b1220"/>
    <circle cx="0" cy="64" r="3.2" fill="#0b1220"/>
  </g>

  <!-- Wordmark: "Pyt" termina em x=236 e "Stop" comeca em x=239; o vao fixo de 3px mais os side bearings le como uma palavra so -->
  <g font-family="'Avenir Next', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="64">
    <text x="236" y="414" text-anchor="end" fill="#6DB3EA">Pyt</text>
    <text x="239" y="414" text-anchor="start" fill="#FFD43B">Stop</text>
  </g>

  <text x="256" y="448" text-anchor="middle" font-family="'Avenir Next', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#7c8ba1" letter-spacing="3">GESTÃO DE ORDENS DE SERVIÇO</text>

  <line x1="156" y1="472" x2="356" y2="472" stroke="#334155" stroke-width="2"/>
  <line x1="196" y1="472" x2="256" y2="472" stroke="#3776AB" stroke-width="3" stroke-linecap="round"/>
  <line x1="256" y1="472" x2="316" y2="472" stroke="#FFD43B" stroke-width="3" stroke-linecap="round"/>
</svg>
